# =========================================================
# OT-Recon known-vulnerability reference database
#
# Sourced from CISA ICS advisories / vendor PSIRT advisories.
# This is NOT a live feed — it's a small, hand-curated set of
# vulnerabilities relevant to components this tool can actually
# fingerprint (model/firmware strings, exposed ports, evidence
# strings). Re-verify against CISA/vendor advisories before acting
# on any finding; firmware string parsing here is best-effort.
#
# match keys:
#   model_contains   - list of substrings checked against host["model"]
#   requires_port     - a port number that must be open
#   requires_evidence - a substring that must appear in host["evidence"]
#   firmware_lt       - if present, only a *confirmed* hit when host
#                        firmware can be parsed and is below this version;
#                        otherwise downgraded to an "Info" possible-match
# =========================================================

siemens:
  - id: "CVE-2019-10943"
    also: ["CVE-2019-10944"]
    title: "SIMATIC S7-1500 web server CSRF/XSS/open-redirect/header-injection (SSA-232418)"
    match:
      model_contains: ["S7-1500", "1500"]
      firmware_lt: "1.5.0"
    severity: "High"
    cvss: 6.8
    advisory: "https://cert-portal.siemens.com/productcert/pdf/ssa-232418.pdf"

  - id: "CVE-2019-10943"
    also: ["CVE-2019-10944"]
    title: "SIMATIC S7-1200 web server CSRF/XSS/open-redirect/header-injection (SSA-232418)"
    match:
      model_contains: ["S7-1200", "1200"]
      firmware_lt: "4.0"
    severity: "High"
    cvss: 6.8
    advisory: "https://cert-portal.siemens.com/productcert/pdf/ssa-232418.pdf"

  - id: "CVE-2025-40943"
    title: "SIMATIC S7-1500/ET 200SP web interface trace-file import allows code injection (ICSA-26-071-04)"
    match:
      model_contains: ["S7-1500", "1500", "ET 200SP", "Drive Controller"]
    severity: "Critical"
    cvss: 9.3
    advisory: "https://www.cisa.gov/news-events/ics-advisories/icsa-26-071-04"

  - id: "CVE-2013-Profinet-DoS"
    title: "SIMATIC S7-1500 CPU firmware <1.5.0 DoS via crafted Profinet packets (defect-mode transition)"
    match:
      model_contains: ["S7-1500", "1500"]
      firmware_lt: "1.5.0"
    severity: "Medium"
    cvss: 7.5
    advisory: "https://github.com/advisories/GHSA-jmv9-4c44-h234"

